<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - Deep Link Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .info-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .url-display {
            background: #2d3748;
            color: #68d391;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            word-break: break-all;
            margin: 10px 0;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin: 10px 5px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>🔗 Opening Deep Link...</h1>
        <p id="status">Đang xử lý link...</p>
        
        <div class="info-box">
            <p><strong>URL hiện tại:</strong></p>
            <div class="url-display" id="currentUrl">-</div>
            <p style="margin-top: 15px;"><strong>Deep Link:</strong></p>
            <div class="url-display" id="deepLink">-</div>
        </div>
        
        <p style="font-size: 0.9em; color: #999;">
            Nếu app không tự động mở, hãy tap vào nút bên dưới
        </p>
        
        <a href="#" id="openLink" class="btn">Mở App</a>
        <a href="/demo-deep-link/" class="btn btn-secondary">Quay lại trang chủ</a>
    </div>
    
    <script>
        // Get current URL path
        const currentPath = window.location.pathname;
        const currentUrl = window.location.href;
        
        // Display current URL
        document.getElementById('currentUrl').textContent = currentUrl;
        
        // Parse the path: /demo-deep-link/product/123 or /demo-deep-link/promotion/CODE
        // Remove /demo-deep-link prefix
        const pathWithoutBase = currentPath.replace('/demo-deep-link', '');
        const pathSegments = pathWithoutBase.split('/').filter(s => s.length > 0);
        
        console.log('Current path:', currentPath);
        console.log('Path segments:', pathSegments);
        
        let deepLinkUrl = '';
        let resourceType = '';
        let resourceId = '';
        
        if (pathSegments.length >= 2) {
            resourceType = pathSegments[0]; // 'product' or 'promotion'
            resourceId = pathSegments[1];   // '123' or 'SUMMER50'
            
            // Get query parameters
            const urlParams = new URLSearchParams(window.location.search);
            let queryString = '';
            if (urlParams.toString()) {
                queryString = '?' + urlParams.toString();
            }
            
            // Construct deep link
            deepLinkUrl = `demoapp://${resourceType}/${resourceId}${queryString}`;
            
            // Update UI
            document.getElementById('deepLink').textContent = deepLinkUrl;
            document.getElementById('openLink').href = deepLinkUrl;
            
            // Update status
            if (resourceType === 'product') {
                document.getElementById('status').innerHTML = 
                    `Đang mở sản phẩm <strong>#${resourceId}</strong>...`;
            } else if (resourceType === 'promotion') {
                document.getElementById('status').innerHTML = 
                    `Đang mở khuyến mãi <strong>${resourceId}</strong>...`;
            } else {
                document.getElementById('status').textContent = 
                    'Đang xử lý deep link...';
            }
            
            // Auto redirect after 1 second
            setTimeout(() => {
                console.log('Attempting to open:', deepLinkUrl);
                window.location.href = deepLinkUrl;
                
                // Update status
                document.getElementById('status').innerHTML = 
                    'Đã gửi yêu cầu mở app!<br><span style="font-size: 0.9em;">Nếu không mở, tap nút bên dưới.</span>';
            }, 1000);
            
            // Fallback message after 3 seconds
            setTimeout(() => {
                const loader = document.querySelector('.loader');
                if (loader) loader.style.display = 'none';
                
                document.getElementById('status').innerHTML = 
                    'App chưa được cài đặt hoặc không thể mở.<br>' +
                    'Vui lòng cài đặt app hoặc tap nút "Mở App" bên dưới.';
            }, 3000);
            
        } else {
            // Invalid URL format, redirect to home
            document.getElementById('status').innerHTML = 
                'URL không hợp lệ.<br>Đang chuyển về trang chủ...';
            
            setTimeout(() => {
                window.location.href = '/demo-deep-link/';
            }, 2000);
        }
    </script>
</body>
</html>
